[project]
name = "unison-backend"
version = "0.1.0"
description = "Сервер музыкальных комнат Unison"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.39,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5.2,<7",
  "celery>=5.4,<6",
  "boto3>=1.37,<2",
  "cryptography>=44,<51",
  "python-json-logger>=3.3,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "boto3-stubs[s3]>=1.37,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: local PostgreSQL, Redis and S3 services"]

