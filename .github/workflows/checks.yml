name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: unison-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.13.0
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check Python
        working-directory: backend
        run: |
          uv run ruff check app tests migrations benchmarks
          uv run ruff format --check app tests migrations benchmarks
          uv run mypy app tests benchmarks
          uv run pytest -q
      - name: Create ephemeral service configuration
        working-directory: backend
        run: |
          uv run python -m app.config --write-env "$RUNNER_TEMP/unison.env"
          echo "UNISON_ENV_FILE=$RUNNER_TEMP/unison.env" >> "$GITHUB_ENV"
      - name: Start integration services
        run: |
          docker compose --env-file "$UNISON_ENV_FILE" up --build -d --wait
          docker compose --env-file "$UNISON_ENV_FILE" run --rm api uv run --no-sync python -m app.init_storage
          docker compose --env-file "$UNISON_ENV_FILE" run --rm worker /app/.venv/bin/python -m app.init_catalog
      - name: Check PostgreSQL, Redis, S3 and WebSocket
        working-directory: backend
        run: uv run pytest -q --tb=short --show-capture=no
      - name: Check full audio processing and isolation
        working-directory: backend
        env:
          UNISON_SYSTEM_URL: http://localhost:8000
          UNISON_TRANSCODER_CONTAINER: unison-ci-transcoder-1
          UNISON_RESTART_CONTAINER: unison-ci-api-1
          UNISON_DATABASE_CONTAINER: unison-ci-postgres-1
        run: uv run pytest -q tests/system --tb=short --show-capture=no
      - name: Check frontend and shared contracts
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:check
          npm run contracts:test
          npm run lint
          npm run build
      - name: Stop integration services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/unison.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/unison.env" down --volumes --remove-orphans
            rm -f "$RUNNER_TEMP/unison.env"
          fi
