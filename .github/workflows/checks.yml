name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: unison-ci
      COMPOSE_FILE: compose.yaml:compose.app.yaml:compose.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.13.0
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check Python
        working-directory: backend
        run: |
          uv run ruff check app tests migrations benchmarks
          uv run ruff format --check app tests migrations benchmarks
          uv run ruff check --target-version py310 ../infra
          uv run ruff format --check ../infra
          uv run mypy app tests benchmarks
          uv run pytest -q
      - name: Create ephemeral service configuration
        run: |
          python3 infra/configure.py --output "$RUNNER_TEMP/unison-runtime"
          echo "UNISON_ENV_FILE=$RUNNER_TEMP/unison-runtime/compose.env" >> "$GITHUB_ENV"
      - name: Allow the transcoder sandbox to create user namespaces
        # Ubuntu 24.04 runners restrict unprivileged user namespaces, which bubblewrap needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pull service images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        # Shared runners hit Docker Hub's anonymous pull limit now and then: log in when
        # credentials exist and retry with a growing pause.
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
          for attempt in 1 2 3 4 5; do
            docker compose --env-file "$UNISON_ENV_FILE" pull --ignore-buildable && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Start integration services
        run: |
          docker compose --env-file "$UNISON_ENV_FILE" up --build -d --wait
          docker compose --env-file "$UNISON_ENV_FILE" exec frontend nginx -t
          docker compose --env-file "$UNISON_ENV_FILE" exec prometheus promtool check config /etc/prometheus/prometheus.yml
          python3 infra/smoke.py --grafana-password-file "$RUNNER_TEMP/unison-runtime/grafana.password"
      - name: Check PostgreSQL, Redis, S3 and WebSocket
        working-directory: backend
        env:
          # Integration fixtures create private temporary buckets outside the public proxy.
          S3_PUBLIC_ENDPOINT: http://localhost:9000
        run: uv run pytest -q --tb=short --show-capture=no
      - name: Check full audio processing and isolation
        working-directory: backend
        env:
          UNISON_SYSTEM_URL: http://localhost:8000
          UNISON_PROXY_URL: http://localhost:8080
          UNISON_TRANSCODER_CONTAINER: unison-ci-transcoder-1
          UNISON_RESTART_CONTAINER: unison-ci-api-1
          UNISON_DATABASE_CONTAINER: unison-ci-postgres-1
          UNISON_STORAGE_CONTAINER: unison-ci-storage-1
        run: uv run pytest -q tests/system --tb=short --show-capture=no
      - name: Explain a sandbox failure
        if: failure()
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          docker logs --tail 40 unison-ci-transcoder-1 || true
          docker exec unison-ci-transcoder-1 /usr/bin/bwrap --unshare-user --unshare-pid --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /etc /etc --dev /dev /usr/bin/true || true
      - name: Check frontend and shared contracts
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:check
          npm run contracts:test
          npm run architecture:check
          npm run lint
          npm run build
      - name: Browser checks against real Python backend
        working-directory: frontend
        env:
          UNISON_E2E_ORIGIN: http://localhost:8080
          UNISON_E2E_EXTERNAL: '1'
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:e2e:api
      - name: Save browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unison-api-browser-results
          path: frontend/test-results/api
      - name: Back up and restore into an empty isolated project
        run: |
          python3 infra/backup.py --env-file "$UNISON_ENV_FILE" --project unison-ci backup "$RUNNER_TEMP/unison-backup"
          python3 infra/backup.py --env-file "$UNISON_ENV_FILE" --project unison-ci-restore --production restore "$RUNNER_TEMP/unison-backup"
      - name: Stop integration services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/unison-runtime/compose.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/unison-runtime/compose.env" -p unison-ci-restore -f compose.yaml -f compose.app.yaml -f compose.production.yaml down --volumes --remove-orphans
            docker compose --env-file "$RUNNER_TEMP/unison-runtime/compose.env" down --volumes --remove-orphans
            rm -rf "$RUNNER_TEMP/unison-runtime"
          fi
